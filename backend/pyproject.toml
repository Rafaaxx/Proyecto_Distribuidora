    "app.modules.costeo.models -> app.core.db",
    "app.modules.costeo.models -> sqlalchemy",
    "app.modules.costeo.repository -> sqlalchemy",
    "app.modules.costeo.service -> sqlalchemy",
    "app.modules.stock.models -> app.core.db",
    "app.modules.stock.models -> sqlalchemy",
    "app.modules.stock.repository -> sqlalchemy",
    "app.modules.stock.service -> sqlalchemy",
    "app.modules.stock.queries -> sqlalchemy",
    "app.modules.stock.api -> fastapi",
    "app.modules.stock.api -> sqlalchemy",
    "app.modules.stock.api -> app.api_v1.dependencias",
