# `costeo` no importa ningun otro modulo de negocio: ni `stock`, ni `catalogo`, ni
# `proveedores`, ni `clientes`, ni `cuentas_corrientes`, ni `configuracion`, ni
# `sync`. Que el producto exista en la organizacion lo garantiza la FK compuesta
# de `costo_producto` (traducida a 404 por el repositorio). De `identidad` solo
# alcanza su `service.py` (permisos, auditoria). El grupo 7 agrega la excepcion de
# `costeo.api -> sync.service` solo si esa ruta llega a escribir (la lectura del
# promedio no pasa por el bus).
[[tool.importlinter.contracts]]
id = "costeo-solo-por-service-ajeno"
name = "costeo solo alcanza a identidad por su service.py y a ningun otro modulo"
type = "forbidden"
source_modules = ["app.modules.costeo"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    "app.modules.configuracion",
    "app.modules.catalogo",
    "app.modules.proveedores",
    "app.modules.clientes",
    "app.modules.cuentas_corrientes",
    "app.modules.stock",
    "app.modules.sync",
]
allow_indirect_imports = "true"

