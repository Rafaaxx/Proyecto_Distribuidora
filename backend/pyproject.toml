[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# El change 02 (organizacion-y-configuracion) es el primer modulo de negocio
# real: agrega aqui las excepciones de `ignore_imports` para que
# `models.py`/`repository.py`/`service.py` de `identidad` y `configuracion`
# puedan importar SQLAlchemy (`service.py` solo para el type hint de
# `Session` que reenvia a `repository.py`; no hay bus de comandos hasta el
# change 04). Todavia no hay `api.py` en ningun modulo (sin rutas de negocio
# en este change, `design.md` D1), asi que no se agrega excepcion para
# FastAPI: el dia que exista un `api.py` real (change 03), se agrega su
# propia excepcion. import-linter falla por diseno ante un `ignore_imports`
# que no matchea ningun import (ver docs/02-arquitectura.md §5.2), asi que
# cada excepcion de abajo corresponde a un import real existente.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain no importa infraestructura"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["fastapi", "sqlalchemy"]
ignore_imports = [
    "app.modules.identidad.models -> app.core.db",
    "app.modules.identidad.models -> sqlalchemy",
    "app.modules.identidad.repository -> sqlalchemy",
    "app.modules.identidad.service -> sqlalchemy",
    "app.modules.identidad.api -> fastapi",
    "app.modules.identidad.api -> sqlalchemy",
    "app.modules.identidad.api -> app.api_v1.dependencias",
    "app.modules.identidad.api -> app.core.autenticacion",
    "app.modules.configuracion.models -> app.core.db",
    "app.modules.configuracion.models -> sqlalchemy",
    "app.modules.configuracion.repository -> sqlalchemy",
    "app.modules.configuracion.service -> sqlalchemy",
    "app.modules.configuracion.queries -> sqlalchemy",
    "app.modules.configuracion.api -> fastapi",
    "app.modules.configuracion.api -> sqlalchemy",
    "app.modules.configuracion.api -> app.api_v1.dependencias",
    "app.modules.configuracion.api -> app.core.autenticacion",
    "app.modules.sync.models -> app.core.db",
    "app.modules.sync.models -> sqlalchemy",
    "app.modules.sync.repository -> sqlalchemy",
    "app.modules.sync.service -> sqlalchemy",
    "app.modules.sync.api -> fastapi",
    "app.modules.sync.api -> sqlalchemy",
    "app.modules.sync.api -> app.api_v1.dependencias",
    "app.modules.sync.api -> app.core.autenticacion",
    "app.modules.catalogo.models -> app.core.db",
    "app.modules.catalogo.models -> sqlalchemy",
    "app.modules.catalogo.repository -> sqlalchemy",
    "app.modules.catalogo.service -> sqlalchemy",
    "app.modules.catalogo.queries -> sqlalchemy",
    "app.modules.catalogo.api -> fastapi",
    "app.modules.catalogo.api -> sqlalchemy",
    "app.modules.catalogo.api -> app.api_v1.dependencias",
    "app.modules.catalogo.api -> app.core.autenticacion",
    "app.modules.proveedores.models -> app.core.db",
    "app.modules.proveedores.models -> sqlalchemy",
    "app.modules.proveedores.repository -> sqlalchemy",
    "app.modules.proveedores.service -> sqlalchemy",
    "app.modules.proveedores.queries -> sqlalchemy",
    "app.modules.proveedores.api -> fastapi",
    "app.modules.proveedores.api -> sqlalchemy",
    "app.modules.proveedores.api -> app.api_v1.dependencias",
    "app.modules.proveedores.api -> app.core.autenticacion",
    # Change 07 (`design.md` D4 y el precedente de `proveedores`/`configuracion`
    # que ya esta declarado mas arriba): `clientes` es el tercer maestro sobre
    # el bus. El grupo 2 (tarea 2.1) agrega `repository.py` y `service.py`, asi
    # que sus dos entradas van junto con las de `proveedores`; el grupo 4
    # (tarea 4.1) agrega `api.py` y las suyas. `import-linter` rechaza una
    # excepcion que no corresponde a ningun import real ("No matches for ignored
    # import"), asi que cada linea de esta lista tiene un import que existe.
    "app.modules.clientes.models -> app.core.db",
    "app.modules.clientes.models -> sqlalchemy",
    "app.modules.clientes.repository -> sqlalchemy",
    "app.modules.clientes.service -> sqlalchemy",
    "app.modules.clientes.api -> fastapi",
    "app.modules.clientes.api -> sqlalchemy",
    "app.modules.clientes.api -> app.api_v1.dependencias",
    "app.modules.clientes.api -> app.core.autenticacion",
    # Change 08 (`design.md` D7, `02` §5.3): `cuentas_corrientes` es el cuarto
    # modulo sobre el bus. Cada grupo agrega las entradas de los archivos que
    # crea (`models.py` en el grupo 2; `repository.py` y `service.py` en el 4;
    # `api.py` en el 6): `import-linter` rechaza una excepcion sin import real.
    "app.modules.cuentas_corrientes.models -> app.core.db",
    "app.modules.cuentas_corrientes.models -> sqlalchemy",
    "app.modules.cuentas_corrientes.repository -> sqlalchemy",
    "app.modules.cuentas_corrientes.service -> sqlalchemy",
    "app.modules.cuentas_corrientes.api -> fastapi",
    "app.modules.cuentas_corrientes.api -> sqlalchemy",
    "app.modules.cuentas_corrientes.api -> app.api_v1.dependencias",
    "app.modules.cuentas_corrientes.api -> app.core.autenticacion",
    # Change 09 (`design.md` D9, `02` §5.3): `costeo` y `stock` son el quinto y el
    # sexto modulo de negocio. Cada grupo agrega las entradas de los archivos que
    # crea (`models.py` en el grupo 2; `repository.py` y `service.py` en el 5;
    # `api.py` en el 7): `import-linter` rechaza una excepcion sin import real.
    "app.modules.costeo.models -> app.core.db",
    "app.modules.costeo.models -> sqlalchemy",
    "app.modules.costeo.repository -> sqlalchemy",
    "app.modules.costeo.service -> sqlalchemy",
    "app.modules.stock.models -> app.core.db",
    "app.modules.stock.models -> sqlalchemy",
    "app.modules.stock.repository -> sqlalchemy",
    "app.modules.stock.service -> sqlalchemy",
    "app.modules.stock.api -> fastapi",
    "app.modules.stock.api -> sqlalchemy",
    "app.modules.stock.api -> app.api_v1.dependencias",
    "app.modules.stock.api -> app.core.autenticacion",
    # Change 10 (`design.md` D10, `02` §5.3): `importacion` es el septimo modulo de
    # negocio. Cada grupo agrega las entradas de los archivos que crea (`models.py` en
    # el grupo 2; `repository.py` y `queries.py` en el 4; `api.py` en el 4):
    # `import-linter` rechaza una excepcion sin import real.
    "app.modules.importacion.models -> app.core.db",
    "app.modules.importacion.models -> sqlalchemy",
    "app.modules.importacion.repository -> sqlalchemy",
    "app.modules.importacion.queries -> sqlalchemy",
    "app.modules.importacion.api -> fastapi",
    "app.modules.importacion.api -> sqlalchemy",
    "app.modules.importacion.api -> app.api_v1.dependencias",
    "app.modules.importacion.api -> app.core.autenticacion",
]

# `allow_indirect_imports`: descubrimiento de la tarea 9.6 (change 05, D12).
# `configuracion.api` importa `app.core.autenticacion` (`requiere_permiso`,
# mismo patrón que `catalogo.api`/`identidad.api`), que a su vez importa
# `identidad.service` (para resolver el contexto autenticado) y este, para
# implementarse a sí mismo, importa `identidad.models`/`identidad.repository`.
# Sin este campo, el contrato (tipo `forbidden`) recorre el grafo
# TRANSITIVAMENTE y marca esa ruta indirecta como violacion, aunque
# `configuracion` nunca importa `identidad.models`/`identidad.repository`
# directamente -- mismo caso ya resuelto para `sync-solo-service` y
# `catalogo-solo-por-service-ajeno` arriba. `allow_indirect_imports` en este
# contrato fue revisado y aceptado por el usuario 2026-09-23 (tarea 13.4):
# no introduce un mecanismo nuevo, reaplica el ya usado arriba.
[[tool.importlinter.contracts]]
name = "configuracion no importa modelos ni repositorio de identidad"
type = "forbidden"
source_modules = ["app.modules.configuracion"]
forbidden_modules = ["app.modules.identidad.models", "app.modules.identidad.repository"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "identidad no importa modelos ni repositorio de configuracion"
type = "forbidden"
source_modules = ["app.modules.identidad"]
forbidden_modules = ["app.modules.configuracion.models", "app.modules.configuracion.repository"]

# Change 04 (`design.md` D3, `02` §5.3): límites del bus de comandos. El
# mecanismo (`app/commands/`) no conoce los módulos que lo usan; el dominio
# de cada módulo no conoce el bus que lo invoca; y `sync/` (dueño de
# `comando`, `comando_cuarentena` y `observacion`, grupo 8 de este change)
# alcanza a los demás módulos únicamente por su `service.py`, nunca por sus
# modelos, repositorio, api o dominio -- mismo criterio que ya separa
# `identidad` de `configuracion` arriba. `app/modules/sync/__init__.py`
# existe desde este change (grupo 1) como paquete vacío para que este
# contrato pueda declararse: import-linter no admite un contrato sobre un
# módulo que no existe todavía. Cuando el grupo 8 agregue módulos nuevos con
# comandos, sus `models`/`repository`/`api`/`domain` se suman a
# `forbidden_modules` de la misma manera.
[[tool.importlinter.contracts]]
id = "commands-no-modulos"
name = "commands no importa modulos de negocio"
type = "forbidden"
source_modules = ["app.commands"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
id = "domain-no-commands"
name = "domain no importa el bus de comandos"
type = "forbidden"
source_modules = [
    "app.modules.identidad.domain",
    "app.modules.configuracion.domain",
    "app.modules.catalogo.domain",
    "app.modules.proveedores.domain",
    "app.modules.clientes.domain",
    "app.modules.cuentas_corrientes.domain",
    "app.modules.costeo.domain",
    "app.modules.stock.domain",
    "app.modules.importacion.domain",
]
forbidden_modules = ["app.commands"]

[[tool.importlinter.contracts]]
id = "sync-solo-service"
name = "sync solo alcanza a los demas modulos por su service.py"
type = "forbidden"
source_modules = ["app.modules.sync"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    "app.modules.configuracion.models",
    "app.modules.configuracion.repository",
    "app.modules.configuracion.api",
    "app.modules.configuracion.domain",
]
# `allow_indirect_imports`: descubrimiento del grupo 8 (change 04, tarea
# 8.7/8.8). `sync/service.py` importa `identidad.service` (permitido: es
# exactamente el patrón que este contrato quiere exigir -- "solo por su
# service.py"), pero `identidad/service.py` a su vez importa
# `identidad.repository`, `identidad.models` y `identidad.domain.*` para
# implementarse a sí mismo. Sin este campo, `import-linter` (tipo
# `forbidden`) recorre el grafo TRANSITIVAMENTE y marca esas rutas
# indirectas como violaciones, aunque `sync` nunca las importa
# directamente -- lo cual haría estructuralmente imposible cumplir la regla
# "un módulo usa a otro solo por su service.py" (`CLAUDE.md` §4) para
# CUALQUIER módulo, porque todo `service.py` importa su propio
# `repository`/`models`/`domain`. `allow_indirect_imports = "true"` restringe
# el contrato a lo que de verdad se quiere prohibir: que `sync` importe esos
# módulos DIRECTAMENTE, sin tocar el caso indirecto a través de `service.py`.
allow_indirect_imports = "true"

# Change 05 (`design.md`, `02` §5.3): `catalogo` es el primer maestro de
# negocio sobre el bus. Su `domain/` es puro (ni infraestructura ni el bus).
# Ademas, `catalogo` no depende de ningun otro modulo de negocio salvo por
# el `service.py` de `configuracion` (alicuota_iva) e `identidad`
# (auditoria/permisos) -- nunca por sus modelos/repositorio/dominio/api.
[[tool.importlinter.contracts]]
id = "catalogo-domain-no-infraestructura"
name = "catalogo domain no importa infraestructura ni el bus de comandos"
type = "forbidden"
source_modules = ["app.modules.catalogo.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.commands"]

# `app.modules.sync` está en `forbidden_modules` (no solo sus
# `models`/`repository`/`api`/`domain` como con `identidad`/`configuracion`)
# porque, a diferencia de esos dos, `catalogo` no consume dato de negocio de
# `sync` -- lo único que existe es la ruta `catalogo.api -> sync.service`
# (`procesar_comando`) que el grupo 9 (`design.md` D4, `CLAUDE.md` §4: "Toda
# escritura de negocio pasa por el bus de comandos") reproduce igual que
# `identidad.api -> sync.service` (ese caso no tiene contrato equivalente
# porque `identidad` no declaró este contrato en el change 04). `catalogo/
# api.py` anota el resultado de `procesar_comando` con `sync_service.Comando`
# (atributo del propio módulo `sync.service`, que ya importa `Comando` de
# `sync.models` para su uso interno) en vez de importar `sync.models`
# directamente -- mismo criterio que `identidad.api`, que no anota ese tipo
# y por eso nunca necesitó esta segunda ruta (hallazgo de la tarea 13.4,
# aprobado por el usuario 2026-09-23: se retira `sync.models` de
# `ignore_imports`, solo queda `sync.service`).
[[tool.importlinter.contracts]]
id = "catalogo-solo-por-service-ajeno"
name = "catalogo solo alcanza a otros modulos de negocio por su service.py"
type = "forbidden"
source_modules = ["app.modules.catalogo"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    "app.modules.configuracion.models",
    "app.modules.configuracion.repository",
    "app.modules.configuracion.api",
    "app.modules.configuracion.domain",
    "app.modules.sync",
    # Change 06 (ADR-025, `design.md` D9): `catalogo` no puede importar
    # `proveedores` en absoluto (ni siquiera por su `service.py`) -- la
    # direccion de dependencia de `02` SS5.3 es
    # `proveedores -> catalogo`, nunca al reves. `catalogo` valida el
    # proveedor con la FK compuesta (existencia/pertenencia) y con el
    # puerto de consulta que `proveedores` registra en
    # `catalogo/service.py` (`registrar_consulta_proveedor`), nunca
    # importando `app.modules.proveedores`.
    "app.modules.proveedores",
    # Change 09 (enmienda a D3, 2026-09-30): `catalogo -> costeo.service` esta
    # permitido (la ruta del costo promedio vive con su entidad, ADR-035 punto 5),
    # pero `catalogo` no importa `stock`: `stock -> catalogo` ya existe y un ciclo
    # seria un error.
    "app.modules.stock",
]
ignore_imports = [
    "app.modules.catalogo.api -> app.modules.sync.service",
]
allow_indirect_imports = "true"

# Change 06 (`design.md`, `02` SS5.3): `proveedores` es el segundo maestro
# de negocio sobre el bus. Su `domain/` es puro (ni infraestructura ni el
# bus) -- mismo criterio que `catalogo-domain-no-infraestructura`.
[[tool.importlinter.contracts]]
id = "proveedores-domain-no-infraestructura"
name = "proveedores domain no importa infraestructura ni el bus de comandos"
type = "forbidden"
source_modules = ["app.modules.proveedores.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.commands"]

# `proveedores` depende de `catalogo`, `configuracion` e `identidad`
# (`02` SS5.3: `proveedores -> catalogo, stock, costeo, cuentas_corrientes`),
# pero solo por su `service.py`, nunca por sus
# modelos/repositorio/dominio/api -- mismo criterio que
# `catalogo-solo-por-service-ajeno`. La unica excepcion es
# `proveedores.api -> sync.service` (`procesar_comando`, grupo 9), igual
# que `catalogo.api -> sync.service`.
[[tool.importlinter.contracts]]
id = "proveedores-solo-por-service-ajeno"
name = "proveedores solo alcanza a otros modulos de negocio por su service.py"
type = "forbidden"
source_modules = ["app.modules.proveedores"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    "app.modules.configuracion.models",
    "app.modules.configuracion.repository",
    "app.modules.configuracion.api",
    "app.modules.configuracion.domain",
    "app.modules.catalogo.models",
    "app.modules.catalogo.repository",
    "app.modules.catalogo.api",
    "app.modules.catalogo.domain",
    "app.modules.sync",
    # Change 08 (`02` §5.3: `proveedores -> cuentas_corrientes`): solo por su
    # `service.py`, nunca por su libro, su repositorio, su api, su dominio ni
    # sus comandos.
    "app.modules.cuentas_corrientes.models",
    "app.modules.cuentas_corrientes.repository",
    "app.modules.cuentas_corrientes.api",
    "app.modules.cuentas_corrientes.domain",
    "app.modules.cuentas_corrientes.commands",
    # Change 11 (`02` §5.3: `proveedores -> catalogo, stock, costeo,
    # cuentas_corrientes, configuracion`): compras y anulaciones usan `stock`,
    # `costeo`, `cuentas_corrientes`, `configuracion` y `catalogo` solo por su
    # `service.py`; nunca por sus libros, repositorios, apis, dominios ni comandos.
    "app.modules.stock.models",
    "app.modules.stock.repository",
    "app.modules.stock.domain",
    "app.modules.stock.api",
    "app.modules.stock.commands",
    "app.modules.costeo.models",
    "app.modules.costeo.repository",
    "app.modules.costeo.domain",
    "app.modules.configuracion.commands",
    "app.modules.catalogo.commands",
]
# Grupo 10 (tarea 10.2): `proveedores/api.py` ya existe y llama a
# `sync_service.procesar_comando` (mismo patron que `catalogo-solo-por-
# service-ajeno`, ver ese contrato mas arriba).
ignore_imports = [
    "app.modules.proveedores.api -> app.modules.sync.service",
]
allow_indirect_imports = "true"

# Change 07 (`design.md` D4, `02` SS5.3): `clientes` es el tercer maestro de
# negocio sobre el bus. Su `domain/` es puro (ni infraestructura ni el bus)
# -- mismo criterio que `proveedores-domain-no-infraestructura`.
[[tool.importlinter.contracts]]
id = "clientes-domain-no-infraestructura"
name = "clientes domain no importa infraestructura ni el bus de comandos"
type = "forbidden"
source_modules = ["app.modules.clientes.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.commands"]

# `clientes` alcanza a `identidad` UNICAMENTE por su `service.py`, porque es
# el unico modulo al que le necesita algo: el setter que fija
# `permite_consumidor_final` y `cliente_consumidor_final_id` de la
# organizacion (`design.md` D4, tarea 2.3). Nunca por sus modelos, su
# repositorio, su dominio o su api -- mismo criterio que
# `configuracion no importa modelos ni repositorio de identidad`, que es el
# contrato que ya separa a `configuracion` de `identidad`.
[[tool.importlinter.contracts]]
id = "clientes-solo-por-service-ajeno"
name = "clientes solo alcanza a otros modulos de negocio por su service.py"
type = "forbidden"
source_modules = ["app.modules.clientes"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    # Change 08 (`02` §5.3: `clientes -> cuentas_corrientes`): solo por su
    # `service.py` (`cuenta_tiene_movimientos`, CLI-06, `design.md` D8), nunca
    # por su libro, su repositorio, su api, su dominio ni sus comandos.
    "app.modules.cuentas_corrientes.models",
    "app.modules.cuentas_corrientes.repository",
    "app.modules.cuentas_corrientes.api",
    "app.modules.cuentas_corrientes.domain",
    "app.modules.cuentas_corrientes.commands",
]
allow_indirect_imports = "true"

# Change 08 (`design.md` D7, `02` SS5.3): `cuentas_corrientes` es un modulo sin
# dependencias de negocio (`cuentas_corrientes, costeo, catalogo -> (sin
# dependencias de negocio)`). Su `domain/` es puro (ni infraestructura ni el
# bus) -- mismo criterio que `clientes-domain-no-infraestructura`.
[[tool.importlinter.contracts]]
id = "cuentas-corrientes-domain-no-infraestructura"
name = "cuentas_corrientes domain no importa infraestructura ni el bus de comandos"
type = "forbidden"
source_modules = ["app.modules.cuentas_corrientes.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.commands"]

# `cuentas_corrientes` no importa ningun otro modulo de negocio: ni `clientes`,
# ni `proveedores`, ni `catalogo`, ni `configuracion`. La existencia de la
# entidad la garantiza la FK compuesta de D6 (traducida a 404 por el
# repositorio) y el consumidor final se reconoce con la configuracion de la
# organizacion. De `identidad` solo alcanza su `service.py` (permisos,
# configuracion de la organizacion, auditoria). La unica excepcion es
# `cuentas_corrientes.api -> sync.service` (`procesar_comando`, grupo 6), igual
# que `proveedores.api -> sync.service`.
[[tool.importlinter.contracts]]
id = "cuentas-corrientes-solo-por-service-ajeno"
name = "cuentas_corrientes solo alcanza a identidad por su service.py y a ningun otro modulo"
type = "forbidden"
source_modules = ["app.modules.cuentas_corrientes"]
forbidden_modules = [
    "app.modules.identidad.models",
    "app.modules.identidad.repository",
    "app.modules.identidad.api",
    "app.modules.identidad.domain",
    "app.modules.configuracion",
    "app.modules.catalogo",
    "app.modules.proveedores",
    "app.modules.clientes",
    "app.modules.sync",
]
# `cuentas_corrientes/api.py` llama a `sync_service.procesar_comando` (grupo 6,
# tarea 6.1), igual que `proveedores.api` y `clientes.api`.
ignore_imports = [
    "app.modules.cuentas_corrientes.api -> app.modules.sync.service",
]
allow_indirect_imports = "true"

# Change 09 (`design.md` D9, `02` SS5.3): `costeo` es un modulo sin dependencias de
# negocio (CST-14: es el unico lugar que calcula costos) y `stock` alcanza a
# `catalogo` y `costeo` solo por su `service.py`. Sus `domain/` son puros (ni
# infraestructura ni el bus) -- mismo criterio que
