name: CI

on:
  push:
  pull_request:

# `docs/02-arquitectura.md` §15 define los 6 pasos de CI en cada push. El
# change 01b cubrió los pasos 1, 2, 4, 5 y 6; el paso 3 (tipos del cliente
# API generados desde el OpenAPI) quedó documentado como hueco deliberado
# (`design.md` D3 del change 01b) hasta que existiera un OpenAPI real que
# generar -- lo cierra el change 03 (tarea 13.1) con el job
# `tipos-api-actualizados`. Las pruebas de concurrencia corren desde el change 28
# (paso propio del trabajo 5). La suite de Playwright en la rama principal
# corre solo en push a `main` (trabajo `aceptacion-playwright`, change 28, D16).

defaults:
  run:
    shell: bash

jobs:
  backend-lint-tipos:
    name: "1. Backend: lint, formato y tipos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff check
        working-directory: backend
        run: python -m ruff check .
      - name: ruff format --check
        working-directory: backend
        run: python -m ruff format --check .
      - name: mypy
        working-directory: backend
        run: python -m mypy app

  frontend-lint-tipos:
    name: "1. Frontend: lint y tipos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Tipos (tsc)
        working-directory: frontend
        run: npm run typecheck

  tipos-api-actualizados:
    name: "3. Tipos del cliente API generados desde el OpenAPI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Regenerar tipos y exigir que no difieran de lo versionado
        working-directory: frontend
        # `docs/02-arquitectura.md` §11: el contrato es el OpenAPI de FastAPI;
        # el front genera sus tipos con openapi-typescript en cada cambio. Si
        # `backend/openapi.json` o `src/api/schema.gen.ts` quedaron
        # desactualizados respecto del código, este paso falla mostrando el
        # diff (tarea 13.1).
        run: npm run check:api-types

  import-linter:
    name: "2. import-linter (límites entre módulos)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: lint-imports
        working-directory: backend
        run: lint-imports

  pruebas-unitarias-y-calculo-compartido:
    name: "4. Unitarias, propiedades, cálculo compartido y Vitest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: pytest unitarias + propiedades + fixtures_compartidos
        working-directory: backend
        run: python -m pytest tests/unit tests/properties tests/fixtures_compartidos
      - name: vitest run
        working-directory: frontend
        run: npm run test -- --run

  integracion-testcontainers:
    name: "5. Integración con Testcontainers (PostgreSQL real)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest integración
        working-directory: backend
        # Sin DATABASE_URL: el conftest levanta el contenedor con
        # Testcontainers (docker ya está disponible en el runner de GitHub
        # Actions). Nunca cae a SQLite (`design.md` D2, `docs/02` §15).
        run: python -m pytest tests/integration
      - name: pytest infraestructura
        working-directory: backend
        # `tests/infra` (change 27a, D17) tambien usa Docker: compose de produccion, Caddy,
        # backups y roles de base. Va en su propio paso porque su `conftest` choca con el de
        # `tests/integration` (ambos se importan como `conftest`) si se juntan en un solo comando.
        run: python -m pytest tests/infra
      - name: pytest concurrencia
        working-directory: backend
        # Change 28 (D12): las pruebas de concurrencia detectan carreras reales contra PostgreSQL
        # real (Testcontainers) y van en su propio paso porque sus `conftest` chocan con los de
        # `tests/integration` si se juntan en un solo comando. Una falla hace fallar la
        # verificacion: una prueba intermitente no se ignora, es una carrera.
        run: python -m pytest tests/concurrency

  aceptacion-playwright:
    name: "Aceptación: suite de Playwright en la rama principal"
    # Change 28 (D16, `docs/02-arquitectura.md` §15): solo en push a `main`. En las ramas de change
    # se corre a mano (`npm run test:e2e`) antes de archivar. Levanta el compose de producción como
    # un proyecto aparte, siembra el escenario, corre la suite y descarta el entorno.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Levantar el entorno de aceptación y correr la suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Subir las trazas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-de-aceptacion
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  seguridad:
    name: "7. Seguridad: dependencias y secretos"
    # Auditoria de seguridad. Falla si hay una vulnerabilidad conocida en las dependencias de
    # produccion (Python y npm, nivel alto o mas) o un secreto versionado. Las excepciones de
    # secretos viven en `.gitleaks.toml`, justificadas.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo: gitleaks revisa tambien los commits, no solo el ultimo arbol.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar herramientas del backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pip-audit (dependencias de produccion del backend)
        working-directory: backend
        # `requirements.txt` ya fija todas las versiones (incluidas las transitivas).
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: npm audit (dependencias de produccion del frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (secretos en el repositorio)
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archivo"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose .

  build-frontend:
    name: "6. Build de producción del frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
