    # Change 15 (`design.md` D1): los archivos de jornadas dentro de `stock`.
    "app.modules.stock.jornadas_repository -> sqlalchemy",
    "app.modules.stock.jornadas_casos -> sqlalchemy",
    # Change 10 (`design.md` D10, `02` §5.3): `importacion` es el septimo modulo de
    # negocio. Cada grupo agrega las entradas de los archivos que crea (`models.py` en
    # el grupo 2; `repository.py` y `queries.py` en el 4; `api.py` en el 4):
    # `import-linter` rechaza una excepcion sin import real.
