name: CI

on:
  push:
  pull_request:

# `docs/02-arquitectura.md` §15 define los 6 pasos de CI en cada push. Este
# change (01b) cubre los pasos 1, 2, 4, 5 y 6. El paso 3 (tipos del cliente
# API generados desde el OpenAPI) y la suite de Playwright en la rama
# principal quedan documentados en `README.md` de este directorio como
# huecos deliberados (ver `design.md` D3 del change 01b).

defaults:
  run:
    shell: bash

jobs:
  backend-lint-tipos:
    name: "1. Backend: lint, formato y tipos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff check
        working-directory: backend
        run: python -m ruff check .
      - name: ruff format --check
        working-directory: backend
        run: python -m ruff format --check .
      - name: mypy
        working-directory: backend
        run: python -m mypy app

  frontend-lint-tipos:
    name: "1. Frontend: lint y tipos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Tipos (tsc)
        working-directory: frontend
        run: npm run typecheck

  import-linter:
    name: "2. import-linter (límites entre módulos)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: lint-imports
        working-directory: backend
        run: lint-imports

  pruebas-unitarias-y-calculo-compartido:
    name: "4. Unitarias, propiedades, cálculo compartido y Vitest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: pytest unitarias + propiedades + fixtures_compartidos
        working-directory: backend
        run: python -m pytest tests/unit tests/properties tests/fixtures_compartidos
      - name: vitest run
        working-directory: frontend
        run: npm run test -- --run

  integracion-testcontainers:
    name: "5. Integración con Testcontainers (PostgreSQL real)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest integración
        working-directory: backend
        # Sin DATABASE_URL: el conftest levanta el contenedor con
        # Testcontainers (docker ya está disponible en el runner de GitHub
        # Actions). Nunca cae a SQLite (`design.md` D2, `docs/02` §15).
        run: python -m pytest tests/integration

  build-frontend:
    name: "6. Build de producción del frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
