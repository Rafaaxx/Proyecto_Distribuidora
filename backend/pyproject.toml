    # Change 07 (`design.md` D4 y el precedente de `proveedores`/`configuracion`
    # que ya esta declarado mas arriba): `clientes` es el tercer maestro sobre
    # el bus. El grupo 2 (tarea 2.1) agrega `repository.py` y `service.py`, asi
